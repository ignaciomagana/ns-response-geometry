name: realistic-eos-benchmark

on:
  push:
    paths:
      - "src/ns_response_geometry/realistic_eos.py"
      - "scripts/realistic_eos_benchmark.py"
      - ".github/workflows/realistic-eos-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen paper environment
        run: python -m pip install -c constraints-paper-20260924.txt -e ".[test]"
      - name: Benchmark named EOS fits
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          set -o pipefail
          python scripts/realistic_eos_benchmark.py | tee realistic_eos_benchmark.log
      - uses: actions/upload-artifact@v4
        with:
          name: realistic-eos-benchmark-log
          path: realistic_eos_benchmark.log
