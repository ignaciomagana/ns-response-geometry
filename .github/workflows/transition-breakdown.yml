name: transition-breakdown

on:
  push:
    paths:
      - "scripts/transition_breakdown.py"
      - ".github/workflows/transition-breakdown.yml"
      - "src/ns_response_geometry/**"
  workflow_dispatch:

jobs:
  transition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -c constraints-paper-20260924.txt -e ".[test]"
      - name: Run transition breakdown
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          set -o pipefail
          python scripts/transition_breakdown.py | tee transition_breakdown.log
      - uses: actions/upload-artifact@v4
        with:
          name: transition-breakdown-log
          path: transition_breakdown.log
