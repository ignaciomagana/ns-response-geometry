name: legacy-fixed-final-compactness-refinement

# SUPERSEDED: manual provenance reproduction only.
# Current science uses scripts/fixed_final_compactness_branchsafe.py.
on:
  workflow_dispatch:

jobs:
  legacy-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Superseded analysis warning
        run: |
          echo "WARNING: this workflow reproduces a superseded historical analysis."
          echo "Do not use its output for current scientific claims."
          echo "See LEGACY.md and paper/CLAIM_PROVENANCE.md."
      - name: Install
        run: python -m pip install -c constraints-paper-20260924.txt -e ".[test]"
      - name: Run legacy analysis
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          set -o pipefail
          python scripts/fixed_final_compactness_refinement.py | tee fixed_final_compactness_refinement.log
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-final-compactness-refinement-log
          path: fixed_final_compactness_refinement.log
