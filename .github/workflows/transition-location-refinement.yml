name: transition-location-refinement

on:
  push:
    paths:
      - "scripts/transition_location_refinement.py"
      - ".github/workflows/transition-location-refinement.yml"
      - "src/ns_response_geometry/**"
  workflow_dispatch:

jobs:
  refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run high-resolution transition-location refinement
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          set -o pipefail
          python scripts/transition_location_refinement.py | tee transition_location.log
      - uses: actions/upload-artifact@v4
        with:
          name: transition-location-log
          path: transition_location.log
