name: paper

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper

      - name: Render PDF pages
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          mkdir -p paper/rendered
          pdftoppm -png -r 144 paper/main.pdf paper/rendered/page

      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-render
          path: |
            paper/main.pdf
            paper/rendered/*.png

      - name: Commit rendered PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f paper/main.pdf
          if git diff --cached --quiet; then
            echo "Rendered PDF unchanged."
          else
            git commit -m "Update rendered paper [skip ci]"
            git push
          fi
