name: radial-mode-validation

on:
  push:
    paths:
      - "src/ns_response_geometry/radial.py"
      - "scripts/radial_mode_validation.py"
      - ".github/workflows/radial-mode-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install frozen paper environment
        run: python -m pip install -c constraints-paper-20260924.txt -e ".[test]"
      - name: Validate radial solver
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          set -o pipefail
          python scripts/radial_mode_validation.py | tee radial_mode_validation.log
      - uses: actions/upload-artifact@v4
        with:
          name: radial-mode-validation-log
          path: radial_mode_validation.log
