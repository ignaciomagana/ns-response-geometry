name: fixed-final-compactness-refinement

on:
  push:
    paths:
      - "scripts/fixed_final_compactness_refinement.py"
      - ".github/workflows/fixed-final-compactness-refinement.yml"
      - "src/ns_response_geometry/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run fixed-final-compactness refinement
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: |
          set -o pipefail
          python scripts/fixed_final_compactness_refinement.py | tee fixed_final_compactness_refinement.log
      - uses: actions/upload-artifact@v4
        with:
          name: fixed-final-compactness-refinement-log
          path: fixed_final_compactness_refinement.log
