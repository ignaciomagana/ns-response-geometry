name: transition-scan

on:
  push:
    paths:
      - "scripts/transition_scan.py"
      - ".github/workflows/transition-scan.yml"
      - "src/ns_response_geometry/**"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run transition scan
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: python scripts/transition_scan.py | tee transition_scan.log
      - uses: actions/upload-artifact@v4
        with:
          name: transition-scan-log
          path: transition_scan.log
