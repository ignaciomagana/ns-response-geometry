name: matched-compactness-transition

on:
  push:
    paths:
      - "scripts/matched_compactness_transition.py"
      - ".github/workflows/matched-compactness-transition.yml"
      - "src/ns_response_geometry/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run matched-compactness transition audit
        env:
          JAX_ENABLE_X64: "true"
          XLA_PYTHON_CLIENT_PREALLOCATE: "false"
        run: python scripts/matched_compactness_transition.py | tee matched_compactness_transition.log
      - uses: actions/upload-artifact@v4
        with:
          name: matched-compactness-transition-log
          path: matched_compactness_transition.log
